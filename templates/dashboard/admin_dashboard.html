{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<h2 class="mb-4">Dashboard</h2>

<div class="row g-4">

    <div class="col-lg-3">

        <div class="card dashboard-card border-0">

            <div class="card-body">

                <i class="bi bi-people-fill display-4 text-primary"></i>

                <h6 class="mt-3 text-muted">

                    Total Leads

                </h6>

                <h2>

                    {{total_leads}}

                </h2>

            </div>

        </div>

    </div>

    <div class="col-lg-3">

        <div class="card dashboard-card border-0">

            <div class="card-body">

                <i class="bi bi-person-plus-fill display-4 text-success"></i>

                <h6 class="mt-3">

                    New

                </h6>

                <h2>

                    {{new_leads}}

                </h2>

            </div>

        </div>

    </div>

    <div class="col-lg-3">

        <div class="card dashboard-card border-0">

            <div class="card-body">

                <i class="bi bi-trophy-fill display-4 text-warning"></i>

                <h6 class="mt-3">

                    Won

                </h6>

                <h2>

                    {{won_leads}}

                </h2>

            </div>

        </div>

    </div>

    <div class="col-lg-3">

        <div class="card dashboard-card border-0">

            <div class="card-body">

                <i class="bi bi-x-circle-fill display-4 text-danger"></i>

                <h6 class="mt-3">

                    Lost

                </h6>

                <h2>

                    {{lost_leads}}

                </h2>

            </div>

        </div>

    </div>

</div>

<div class="row mt-4">

    <div class="col-lg-5 col-md-6">

        <div class="card shadow-sm">

            <div class="card-header bg-white">
                <h5 class="mb-0">Lead Status Overview</h5>
            </div>

            <div class="card-body d-flex justify-content-center">

                <canvas id="leadChart" width="250" height="250"></canvas>

            </div>

        </div>

    </div>

</div>

<script>
    window.onload = function () {

        const canvas = document.getElementById("leadChart");

        if (!canvas) {
            console.log("Canvas not found");
            return;
        }

        const newLeads = parseInt("{{ new_leads|default:'0' }}");
        const wonLeads = parseInt("{{ won_leads|default:'0' }}");
        const lostLeads = parseInt("{{ lost_leads|default:'0' }}");

        new Chart(canvas, {
            type: "doughnut",
            data: {
                labels: ["New", "Won", "Lost"],
                datasets: [{
                    label: "Leads",
                    data: [newLeads, wonLeads, lostLeads],
                    backgroundColor: [
                        "#0d6efd",
                        "#198754",
                        "#dc3545"
                    ],
                    borderColor: "#ffffff",
                    borderWidth: 2
                }]
            },
            options: {
                responsive: false,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: "bottom"
                    }
                }
            }
        });

    };
</script>

{% endblock %}
