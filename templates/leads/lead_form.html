{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">

                        Add New Lead

                    </h3>

                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="text-end">

                            <button class="btn btn-primary px-4">

                                Save Lead

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
